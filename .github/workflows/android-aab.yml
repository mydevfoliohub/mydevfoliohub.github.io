name: Build Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website and Android project
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK packages are available
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          "$SDKMANAGER_PATH" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Install pinned Capacitor dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync current website into Android app
        run: npm run mobile:sync

      - name: Build testing-only debug APK and AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload testing-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Deviloq-v2.3.4-TESTING-ONLY-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: Deviloq-v2.3.4-TESTING-ONLY-debug-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
