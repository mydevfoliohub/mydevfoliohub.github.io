<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#11010a">
  <title>Page Not Found | Deviloq</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .not-found-page{min-height:100vh;display:grid;place-items:center;padding:24px}
    .not-found-card{width:min(620px,100%);padding:clamp(28px,6vw,56px);border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:0 24px 70px rgba(0,0,0,.28)}
    .not-found-brand{display:flex;align-items:center;gap:12px;margin:0 0 32px;color:var(--text);font:700 14px monospace;letter-spacing:1.4px}.not-found-brand img{width:42px;height:42px}
    .not-found-code{margin:0 0 14px;color:var(--green);font:700 12px monospace;letter-spacing:1.4px}
    .not-found-card h1{margin:0 0 14px;font-size:clamp(32px,7vw,52px)}
    .not-found-card p{margin:0 0 26px;color:var(--muted);line-height:1.75}
  </style>
</head>
<body>
  <main class="not-found-page">
    <section class="not-found-card" aria-labelledby="notFoundHeading">
      <div class="not-found-brand" aria-label="Deviloq"><img src="/assets/brand/deviloq-mark.svg" alt="" aria-hidden="true" width="42" height="42"><span>DEVILOQ</span></div>
      <p class="not-found-code">404 / PAGE_NOT_FOUND</p>
      <h1 id="notFoundHeading">Lost somewhere in the stack?</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a class="platform-button primary" href="/">Back Home</a>
    </section>
  </main>
</body>
</html>
